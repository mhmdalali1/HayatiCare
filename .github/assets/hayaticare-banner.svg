    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1A4757"/><stop offset="1" stop-color="#102C40"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#65EBC7" stop-opacity=".21"/><stop offset="1" stop-color="#65EBC7" stop-opacity="0"/></radialGradient>
