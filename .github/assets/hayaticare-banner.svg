<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390">
  <title>HayatiCare — connected care, thoughtfully designed</title>
  <desc>Custom navy and teal hero banner with project branding and connected care modules.</desc>
