<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMSS — Login</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="logo-area">
      <h1>🏥 HMSS</h1>
      <p>Hospital Management Software System</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@hospital.com" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <p id="error-msg" class="error-msg"></p>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <p class="mt-2" style="text-align:center; font-size:.85rem;">
      <a href="#" onclick="showResetForm(); return false;">Forgot password?</a>
    </p>
  </div>

  <!-- Password reset inline form (hidden by default) -->
  <div id="reset-panel" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:200;">
    <div class="login-card" style="width:380px;">
      <h2 style="margin-bottom:20px;">Reset Password</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reset-email" placeholder="your@email.com" />
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="submitReset()">Send Reset Link</button>
      <p class="mt-1" style="text-align:center;">
        <a href="#" onclick="hideResetForm(); return false;">Back to login</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function showResetForm() {
      document.getElementById("reset-panel").style.display = "flex";
    }
    function hideResetForm() {
      document.getElementById("reset-panel").style.display = "none";
    }
    async function submitReset() {
      const email = document.getElementById("reset-email").value;
      const res = await api.post("/api/auth/reset-password-request", { email });
      showToast(res.message, res.success ? "success" : "error");
      if (res.success) hideResetForm();
    }
  </script>
</body>
</html>
