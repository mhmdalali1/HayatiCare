<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Batch Results — HayatiCare</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🏥 HMSS</div>
      <div class="sidebar-user-name" id="sidebar-user-name"></div>
      <div class="sidebar-role">Doctor</div>
    </div>
    <div class="sidebar-nav">
      <a href="dashboard.html" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="appointments.html" data-page="appointments"><span class="nav-icon">📅</span> Appointments</a>
      <a href="patient_records.html" data-page="patient_records"><span class="nav-icon">👤</span> Patient Records</a>
      <a href="results.html" data-page="results" class="active"><span class="nav-icon">🧪</span> Results</a>
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-logout" onclick="logout()">🚪 Sign Out</button>
    </div>
  </nav>

  <main class="content" id="main-content">
    <div class="page-header">
      <button class="btn btn-outline" onclick="goBackToPatient()" style="margin-right:12px">&larr; Back</button>
      <h1>Batch Results</h1>
    </div>

    <div id="batch-info" style="margin-bottom:16px;font-size:1.05rem;font-weight:600;color:var(--dark)"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Test Code</th>
            <th>Test Name</th>
            <th>Value</th>
            <th>Unit</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="batch-results-tbody">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <script>
var _drBatchRefreshInterval = null;
var _currentBatchId = null;
var _currentPatientId = null;

function pageInit() {
  _currentBatchId = getBatchIdFromUrl();
  _currentPatientId = getPatientIdFromUrl();
  if (!_currentBatchId) {
    document.getElementById("batch-info").textContent = "Invalid batch";
    return;
  }
  loadBatchResults();
  startAutoRefresh();
}

function pageDestroy() {
  stopAutoRefresh();
}

function getBatchIdFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var id = parseInt(params.get("batch_id"), 10);
  return isNaN(id) ? null : id;
}

function getPatientIdFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var id = parseInt(params.get("patient_id"), 10);
  return isNaN(id) ? null : id;
}

function goBackToPatient() {
  if (_currentPatientId) {
    navigateTo('results_patient.html?patient_id=' + _currentPatientId);
  } else {
    navigateTo('results.html');
  }
}

function startAutoRefresh() {
  stopAutoRefresh();
  _drBatchRefreshInterval = setInterval(function() {
    loadBatchResults(true);
  }, 5000);
}

function stopAutoRefresh() {
  if (_drBatchRefreshInterval) {
    clearInterval(_drBatchRefreshInterval);
    _drBatchRefreshInterval = null;
  }
}

function loadBatchResults(isAutoRefresh) {
  var tbody = document.getElementById("batch-results-tbody");
  if (!tbody) return;
  if (!isAutoRefresh) {
    tbody.innerHTML = "<tr><td colspan='6'>Loading...</td></tr>";
  }
  api.get("/api/patient-results/batch/" + _currentBatchId).then(function(data) {
    if (!data.success) {
      if (!isAutoRefresh) tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;padding:24px;color:var(--danger)'>" + (data.message || "Error loading results") + "</td></tr>";
      return;
    }
    var list = data.data || [];
    var infoEl = document.getElementById("batch-info");
    if (infoEl && list.length > 0) {
      infoEl.textContent = list[0].patient_name || "Patient #" + list[0].patient_id;
    } else if (infoEl) {
      infoEl.textContent = "Batch #" + _currentBatchId;
    }
    tbody.innerHTML = "";
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-muted" style="text-align:center;padding:24px">No results in this batch</td></tr>';
      return;
    }
    list.forEach(function(r) {
      var tr = document.createElement("tr");
      var statusClass = r.status;
      tr.innerHTML =
        "<td>" + (r.test_code || "?") + "</td>" +
        "<td>" + (r.test_name || "?") + "</td>" +
        "<td>" + (r.value || "?") + "</td>" +
        "<td>" + (r.unit || "?") + "</td>" +
        "<td><span class=\"badge badge-" + statusClass + "\">" + statusClass + "</span></td>" +
        "<td>" + fmtDate(r.created_at) + "</td>";
      tbody.appendChild(tr);
    });
  });
}

(function() {
  function _dc() {
    var user = getCurrentUser();
    if (!user || user.role !== "doctor") {
      clearSession();
      window.location.href = "/index.html";
      return;
    }
    initSidebar(user);
    pageInit();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _dc);
  } else {
    _dc();
  }
})();
    </script>
  </main>
</div>
<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/doctor.js"></script>
</body>
</html>
