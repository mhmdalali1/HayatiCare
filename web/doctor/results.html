<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Results — HayatiCare</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🏥 HMSS</div>
      <div class="sidebar-user-name" id="sidebar-user-name"></div>
      <div class="sidebar-role">Doctor</div>
    </div>
    <div class="sidebar-nav">
      <a href="dashboard.html" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="appointments.html" data-page="appointments"><span class="nav-icon">📅</span> Appointments</a>
      <a href="patient_records.html" data-page="patient_records"><span class="nav-icon">👤</span> Patient Records</a>
      <a href="results.html" data-page="results" class="active"><span class="nav-icon">🧪</span> Results</a>
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-logout" onclick="logout()">🚪 Sign Out</button>
    </div>
  </nav>

  <main class="content" id="main-content">
    <div class="page-header">
      <h1>Patient Test Results</h1>
    </div>

    <div id="results-patient-cards"></div>

    <script>
var _drResultsRefreshInterval = null;

function pageInit() {
  loadGroupedPatients();
  startResultsAutoRefresh();
}

function pageDestroy() {
  stopResultsAutoRefresh();
}

function startResultsAutoRefresh() {
  stopResultsAutoRefresh();
  _drResultsRefreshInterval = setInterval(function() {
    loadGroupedPatients(true);
  }, 5000);
}

function stopResultsAutoRefresh() {
  if (_drResultsRefreshInterval) {
    clearInterval(_drResultsRefreshInterval);
    _drResultsRefreshInterval = null;
  }
}

function loadGroupedPatients(isAutoRefresh) {
  var container = document.getElementById("results-patient-cards");
  if (!container) return;
  if (!isAutoRefresh) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray)">Loading...</div>';
  }
  api.get("/api/patient-results/grouped-by-patient").then(function(data) {
    if (!data.success) {
      console.error("grouped-by-patient error:", data.message || data);
      if (!isAutoRefresh) container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger)">' + (data.message || "Error loading results") + '</div>';
      return;
    }
    var list = data.data || [];
    if (list.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--gray)"><p style="font-size:1.1rem;margin-bottom:8px">No results found</p><p style="font-size:.9rem">Results submitted by the secretary will appear here.</p></div>';
      return;
    }
    var html = '<div class="results-summary-grid">';
    list.forEach(function(p) {
      html +=
        '<div class="patient-result-card" onclick="navigateTo(\'results_patient.html?patient_id=' + p.patient_id + '\')">' +
          '<div class="rsc-badge">' + (p.patient_code || "—") + '</div>' +
          '<div class="rsc-name">' + (p.patient_name || "?") + '</div>' +
          '<div class="rsc-footer">' +
            '<span class="rsc-count">' + p.result_count + ' result' + (p.result_count !== 1 ? "s" : "") + '</span>' +
            '<span class="rsc-date">' + fmtDate(p.latest_date) + '</span>' +
          '</div>' +
        '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  });
}

(function() {
  function _dc() {
    var user = getCurrentUser();
    if (!user || user.role !== "doctor") {
      clearSession();
      window.location.href = "/index.html";
      return;
    }
    initSidebar(user);
    pageInit();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", _dc);
  } else {
    _dc();
  }
})();
    </script>
  </main>
</div>
<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/doctor.js"></script>
</body>
</html>
