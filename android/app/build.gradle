plugins {
    id 'com.android.application'
}

// Override with -PHAYATICARE_API_BASE_URL=http://YOUR_PC_LAN_IP:5000/
def localApiBaseUrl = project.findProperty('HAYATICARE_API_BASE_URL') ?: 'http://10.0.2.2:5000/'

android {
    namespace 'com.hmss'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.hmss"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Default BASE_URL for the Android emulator (localhost via 10.0.2.2).
        // Physical devices: pass -PHAYATICARE_API_BASE_URL=http://YOUR_PC_LAN_IP:5000/
        buildConfigField "String", "BASE_URL", "\"${localApiBaseUrl}\""
    }

    buildTypes {
        debug {
            // Uses the same override as defaultConfig for local device testing.
            buildConfigField "String", "BASE_URL", "\"${localApiBaseUrl}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Replace with your production HTTPS URL before releasing.
            buildConfigField "String", "BASE_URL", '"https://your-production-server.com/"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
